databases:
  - name: playbed-db
    plan: free
    databaseName: playbed
    user: playbed

services:
  - type: web
    name: playbed
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: playbed-db
          property: connectionString
