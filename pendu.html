    content="PlayBed, Obed Tassango, jeux en ligne, pendu, plus ou moins, vrai ou faux, Python, HTML, CSS">

  <meta property="og:title" content="PlayBed - Jeux créés par Obed Tassango">
  <meta property="og:description" content="Découvrez PlayBed, une plateforme de jeux développée par Obed Tassango.">

  <meta name="description" content="Jeu du Pendu - Devinez le mot lettre par lettre avec PlayBed.">
  <link rel="stylesheet" href="/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8115913863262508"
    crossorigin="anonymous"></script>

<body>

  <header>
    <div class="container">
      <h1>Bienvenue sur le <strong>jeu du Pendu</strong> !</h1>

      <nav>
        <ul>
          <li><a href="index.html">Page d'accueil</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">

    <section>
      <p>Prêt à t'amuser ? Lance-toi ! On ne vit qu'une seule fois</p>
    </section>

    <section>

      <article class="game-box">

        <div class="reponse">
          <p>
            <REPONSE>
          </p>
        </div>

        <form method="POST">

          <div class="form-group">
            <label for="choix">Choisir une lettre :</label>

            <input type="text" id="choix" name="choix" maxlength="1" required pattern="[A-Za-z]">
          </div>

          <div class="buttons">
            <button type="submit">Envoyer</button>
          </div>

        </form>
        <form class="buttons" method="GET" action="/new/<GAME_ID>">
          <button type="submit">Nouvelle partie</button>
        </form>

      </article>

    </section>

    <section>
      <figure>
        <img src="/Images/pendu.png" alt="Illustration du jeu du Pendu" width="150">
        <figcaption>Trouve le mot avant que vous ne soyez pendu </figcaption>
      </figure>
    </section>

    <aside class="astuce">
      <h2> Astuce du jour</h2>
      <p>Commence toujours par les <strong>voyelles</strong> au Pendu !</p>
    </aside>

  </main>

  <footer>
    <p>© 2026 PlayBed - Créé par Obed Tassango</p>
  </footer>

</body>
