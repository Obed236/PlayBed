name: PlayBed checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import Flask application and check routes
        env:
          SECRET_KEY: ci-secret-key
          SESSION_COOKIE_SECURE: "0"
        run: |
          python - <<'PY'
          import app
          rules = {rule.rule for rule in app.app.url_map.iter_rules()}
          required = {
              "/",
              "/health",
              "/imposteur",
              "/api/memory-flip",
              "/admin/administrateurs/pseudo",
              "/mon-compte-admin/pseudo",
          }
          missing = required - rules
          assert not missing, f"Routes manquantes: {sorted(missing)}"
          assert app.app.session_interface.__class__.__name__ == "DatabaseSessionInterface"
          print("PlayBed import and routes: OK")
          PY

      - name: Render public home
        env:
          SECRET_KEY: ci-secret-key
          SESSION_COOKIE_SECURE: "0"
        run: |
          python - <<'PY'
          import app
          app.init_db()
          client = app.app.test_client()
          response = client.get("/")
          assert response.status_code == 200
          assert b"PlayBed" in response.data
          print("Home render: OK")
          PY
