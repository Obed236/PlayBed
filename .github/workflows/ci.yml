name: PlayBed checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile app.py core.py imposteur.py admin_routes.py admin_accounts.py admin_linking.py admin_badges.py admin_complete.py admin_action_verite.py
      - name: Import Flask application and check templates
        env:
          SECRET_KEY: ci-secret-key
        run: python -c "import app; rules={r.rule for r in app.app.url_map.iter_rules()}; assert '/imposteur' in rules; assert '/admin/administrateurs/pseudo' in rules; assert '/mon-compte-admin/pseudo' in rules; app.app.jinja_env.get_template('leaderboard.html'); app.app.jinja_env.get_template('admin/users.html'); app.app.jinja_env.get_template('admin/admins.html'); app.app.jinja_env.get_template('admin/dashboard.html'); print('Routes:', len(rules), 'Imposteur: OK, admin self-link: OK')"
