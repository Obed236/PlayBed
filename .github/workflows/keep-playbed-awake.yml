name: Keep PlayBed awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-playbed-awake
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake PlayBed through health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            response="$(curl --silent --show-error --location \
              --connect-timeout 20 \
              --max-time 90 \
              -H 'User-Agent: PlayBed-Keepalive/1.0' \
              'https://playbed.fr/health' || true)"

            if printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "PlayBed is awake."
              exit 0
            fi

            echo "Attempt ${attempt}: service is not ready yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "PlayBed did not become ready in time."
          exit 1

      - name: Verify robots.txt after wake-up
        shell: bash
        run: |
          set -euo pipefail

          robots="$(curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 60 \
            -H 'User-Agent: PlayBed-Keepalive/1.0' \
            'https://playbed.fr/robots.txt')"

          printf '%s\n' "$robots"

          if printf '%s\n' "$robots" | grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$'; then
            echo "robots.txt is still blocking crawlers."
            exit 1
          fi

          printf '%s\n' "$robots" | grep -Eq '^Allow:[[:space:]]*/[[:space:]]*$'
          echo "robots.txt allows crawling."
