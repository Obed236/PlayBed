name: Keep PlayBed awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-playbed-awake
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake PlayBed through health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            nonce="$(date +%s)"
            response="$(curl --silent --show-error --location \
              --connect-timeout 20 \
              --max-time 90 \
              -H 'User-Agent: PlayBed-Keepalive/1.1' \
              "https://playbed.fr/health?keepalive=${nonce}" || true)"

            if printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "PlayBed is awake."
              exit 0
            fi

            echo "Attempt ${attempt}: service is not ready yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "PlayBed did not become ready in time."
          exit 1

      - name: Verify homepage responds
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            body_file="$(mktemp)"

            if ! http_code="$(curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 20 \
              -H 'User-Agent: PlayBed-Keepalive/1.1' \
              --output "$body_file" \
              --write-out '%{http_code}' \
              "https://playbed.fr/?keepalive=$(date +%s)")"; then
              http_code="000"
            fi

            if [[ "$http_code" =~ ^[23][0-9][0-9]$ ]]; then
              rm -f "$body_file"
              echo "Homepage responds with HTTP ${http_code}."
              exit 0
            fi

            if [ "$http_code" = "503" ] && grep -Fq 'PlayBed est en maintenance' "$body_file"; then
              rm -f "$body_file"
              echo "Homepage is intentionally in maintenance mode (HTTP 503)."
              exit 0
            fi

            rm -f "$body_file"

            if [ "$attempt" -lt 5 ]; then
              echo "Homepage attempt ${attempt} returned HTTP ${http_code}. Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Homepage did not return a healthy response or the expected maintenance page after 5 attempts."
          exit 1

      - name: Verify robots.txt after wake-up
        shell: bash
        run: |
          set -euo pipefail

          robots="$(curl --fail --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 60 \
            -H 'User-Agent: PlayBed-Keepalive/1.1' \
            'https://playbed.fr/robots.txt')"

          printf '%s\n' "$robots"

          if printf '%s\n' "$robots" | grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$'; then
            echo "robots.txt is still blocking crawlers."
            exit 1
          fi

          printf '%s\n' "$robots" | grep -Eq '^Allow:[[:space:]]*/[[:space:]]*$'
          echo "robots.txt allows crawling."
