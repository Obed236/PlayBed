<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>{% block title %}Administration{% endblock %} · PlayBed</title>
    <style>
        :root{color-scheme:dark;--bg:#07111f;--panel:#0d1a2b;--panel2:#122238;--line:#263a54;--text:#eef5ff;--muted:#9eb0c6;--accent:#6ca8ff;--good:#40c98a;--bad:#ff6b78;--warn:#ffc857}
        *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0a1626 55%,#0d1b2d);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.admin-shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:rgba(8,19,33,.96);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;margin:0 8px 20px}.nav{display:grid;gap:5px;padding-bottom:130px}.nav a{padding:10px 12px;border-radius:11px;color:var(--muted)}.nav a:hover,.nav a.active{background:var(--panel2);color:var(--text)}.sidebar-bottom{position:absolute;left:16px;right:16px;bottom:20px}.main{padding:30px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.topbar h1{font-size:28px;margin:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:rgba(13,26,43,.9);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.15)}.card{padding:18px}.card strong{display:block;font-size:28px;margin-top:6px}.panel{padding:18px;margin-bottom:18px}.panel h2,.panel h3{margin-top:0}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:680px;background:rgba(5,13,24,.3)}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:rgba(17,34,56,.8)}tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}.badge.good{color:#a5ffd2;border-color:#266746}.badge.bad{color:#ffc0c5;border-color:#7a303a}.badge.warn{color:#ffe7a8;border-color:#70551f}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{filter:brightness(1.1)}.btn.primary{background:#195db6;border-color:#2a72cf}.btn.danger{background:#5a2028;border-color:#87333f}.btn.good{background:#174f38;border-color:#28704f}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-weight:600}.field input,.field select,.field textarea{width:100%;background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px}.field textarea{min-height:100px;resize:vertical}.inline-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.inline-form .field{margin:0;min-width:170px}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(108,168,255,.08);margin-bottom:15px}.notice.warn{background:rgba(255,200,87,.08);border-color:#70551f}.logout{width:100%}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#07111f;border:1px solid var(--line);padding:2px 6px;border-radius:6px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:rgba(13,26,43,.96);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.login-card h1{margin:0 0 8px}.error{background:rgba(255,107,120,.1);border:1px solid #74333a;color:#ffd1d5;padding:11px 12px;border-radius:10px;margin:14px 0}.game-card{padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.game-card h3{margin:0 0 4px}.question-row{padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.question-row p{margin:0 0 7px}.stack{display:grid;gap:12px}.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mini-stats>div{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(7,17,31,.45)}.mini-stats strong{display:block;font-size:20px}.help{font-size:12px;color:var(--muted)}
        @media(max-width:900px){.admin-shell{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:0}.sidebar-bottom{position:static;margin-top:12px}.main{padding:20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2,.grid-3{grid-template-columns:1fr}}
        @media(max-width:540px){.cards,.mini-stats{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start;flex-direction:column}.main{padding:16px}.sidebar{padding:16px}.brand{margin-bottom:14px}}
    </style>
</head>
<body>
{% if admin_session %}
<div class="admin-shell">
    <aside class="sidebar">
        <a class="brand" href="{{ url_for('admin_dashboard') }}">🎮 PlayBed Admin</a>
        <nav class="nav">
            <a href="{{ url_for('admin_dashboard') }}">Tableau de bord</a>
            <a href="{{ url_for('admin_users') }}">Utilisateurs</a>
            <a href="{{ url_for('admin_games') }}">Jeux</a>
            <a href="{{ url_for('admin_scores') }}">Scores</a>
            <a href="{{ url_for('admin_questions') }}">Questions</a>
            <a href="{{ url_for('admin_reports') }}">Signalements</a>
            <a href="{{ url_for('admin_announcements') }}">Annonces</a>
            <a href="{{ url_for('admin_logs_page') }}">Journal admin</a>
            <a href="{{ url_for('admin_settings') }}">Paramètres</a>
            <a href="{{ url_for('home') }}" target="_blank" rel="noopener">Voir PlayBed ↗</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="muted" style="margin:0 0 8px 4px">Connecté : {{ admin_session }}</div>
            <form method="post" action="{{ url_for('admin_logout') }}">
                <input type="hidden" name="csrf_token" value="{{ admin_csrf_token() }}">
                <button class="btn logout" type="submit">Se déconnecter</button>
            </form>
        </div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
{% else %}
    {% block guest_content %}{% endblock %}
{% endif %}
</body>
</html>
