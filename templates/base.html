<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="{% block description %}PlayBed, la plateforme gratuite de mini-jeux rapides sur navigateur.{% endblock %}">
    <meta name="author" content="Obed Gelly Ousmane Tassango">
    <meta name="theme-color" content="#08111f">
    <meta name="google-adsense-account" content="ca-pub-8115913863262508">
    <meta property="og:title" content="{% block og_title %}PlayBed V2{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Joue gratuitement à des mini-jeux rapides sur PlayBed.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://playbed.fr{{ request.path }}">
    <title>{% block title %}PlayBed{% endblock %}</title>
    <link rel="canonical" href="https://playbed.fr{{ request.path }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8115913863262508"
        crossorigin="anonymous"></script>
</head>

<body>
    <header class="navbar">
        <a class="brand" href="{{ url_for('home') }}"><span>🎮</span> PlayBed</a>
        <nav class="nav-links" aria-label="Navigation principale">
            <a href="{{ url_for('home') }}#games">Jeux</a>
            <a href="{{ url_for('how_to_play_page') }}">Comment jouer</a>
            <a href="{{ url_for('about_page') }}">À propos</a>
            <a href="{{ url_for('leaderboard') }}">Classement</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Changer de thème">☀️</button>
            {% if pseudo %}
            <span class="player-chip">👤 {{ pseudo }}</span>
            {% endif %}
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <div class="footer-copy">
            <span>© 2026 PlayBed · Créé et développé par Obed Gelly Ousmane Tassango.</span>
            <span>Gratuit · Rapide · Accessible</span>
        </div>
        <nav class="footer-links" aria-label="Informations et mentions">
            <a href="{{ url_for('about_page') }}">À propos</a>
            <a href="{{ url_for('how_to_play_page') }}">Comment jouer</a>
            <a href="{{ url_for('faq_page') }}">FAQ</a>
            <a href="{{ url_for('privacy_page') }}">Confidentialité</a>
            <a href="{{ url_for('terms_page') }}">Conditions d’utilisation</a>
        </nav>
    </footer>
</body>

</html>
